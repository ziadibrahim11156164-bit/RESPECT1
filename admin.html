<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ｒｅｓｐｅｃｔ — Free Fire Clan</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#07070a;--p:#13131a;--g:rgba(255,255,255,.05);--bd:rgba(255,255,255,.1);--t:#fff;--m:#9aa0ad;--r:#e11d2e;--glow:0 0 22px rgba(225,29,46,.55);box-sizing:border-box}
:root[data-theme=light]{--bg:#f4f4f7;--p:#fff;--g:rgba(0,0,0,.04);--bd:rgba(0,0,0,.12);--t:#111;--m:#555}
*{box-sizing:border-box}html{height:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--t);font-family:Tajawal,system-ui,Segoe UI,sans-serif;min-height:100%;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--bgimg,none) center/cover no-repeat;opacity:.3}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 40% at 50% 0,rgba(225,29,46,.28),transparent 70%)}
nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.logo{font-weight:900;font-size:20px;color:var(--r);text-shadow:var(--glow);display:flex;align-items:center;gap:8px;cursor:pointer}.logo img{height:30px;max-width:120px;object-fit:contain;border-radius:6px}
.links{display:flex;gap:4px;margin-inline-start:auto;align-items:center}.links a,.ib{color:var(--t);text-decoration:none;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;background:none;border:0}
.links a:hover,.ib:hover{background:var(--g);color:var(--r)}
.btn{display:inline-block;background:linear-gradient(180deg,#ff3347,#b8101f);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-weight:800;cursor:pointer;box-shadow:var(--glow),0 5px 0 #7a0a14;transition:.15s;font-size:15px;text-decoration:none;font-family:inherit}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:var(--glow),0 1px 0 #7a0a14}.btn.s{background:var(--g);box-shadow:none;border:1px solid var(--bd);color:var(--t)}.btn.sm{padding:6px 12px;font-size:13px;box-shadow:none}
main{position:relative;z-index:1;max-width:1100px;margin:auto;padding:0 16px 40px}
section{padding:56px 0}h2{font-size:clamp(24px,5vw,36px);margin:0 0 24px;position:relative;display:inline-block}h2::after{content:"";display:block;height:3px;width:60%;background:var(--r);box-shadow:var(--glow);margin-top:6px}
.hero{min-height:82vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}.hero h1{font-size:clamp(48px,14vw,120px);margin:0;color:var(--r);text-shadow:var(--glow),0 0 70px rgba(225,29,46,.6);animation:fl 4s ease-in-out infinite;line-height:1;white-space:nowrap;display:inline-block;max-width:100%}
@keyframes fl{50%{transform:translateY(-10px) rotateX(8deg)}}.hero h3{letter-spacing:.4em;margin:0;font-size:clamp(14px,3vw,22px)}.hero p{max-width:600px;color:var(--m);font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.card{background:var(--g);border:1px solid var(--bd);border-radius:16px;padding:20px;backdrop-filter:blur(10px);transition:transform .2s,box-shadow .2s,border-color .2s;transform-style:preserve-3d;position:relative}.card:hover{border-color:var(--r);box-shadow:var(--glow)}.card img.av{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;margin-bottom:12px}
.rank{color:var(--r);font-weight:800;font-size:13px;text-transform:uppercase}.num{font-size:38px;font-weight:900;color:var(--r)}.ic{font-size:34px}label{display:block;margin:12px 0 4px;color:var(--m);font-size:14px}
input,textarea,select{width:100%;background:var(--p);color:var(--t);border:1px solid var(--bd);border-radius:10px;padding:11px;font:inherit}input:focus,textarea:focus{outline:0;border-color:var(--r);box-shadow:var(--glow)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px;text-align:start;border-bottom:1px solid var(--bd)}tr.r{cursor:pointer}tr.r:hover{background:var(--g)}
.tag{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}.pending{background:#f59e0b33;color:#f59e0b}.accepted{background:#22c55e33;color:#22c55e}.rejected{background:#ef444433;color:#ef4444}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ed{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}.msg{padding:12px;border-radius:10px;margin:12px 0}.ok{background:#22c55e22;color:#22c55e}.er{background:#ef444422;color:#ef4444}
video{width:100%;border-radius:12px;max-height:360px;background:#000}footer{position:relative;z-index:1;border-top:1px solid var(--bd);padding:28px 16px;text-align:center;color:var(--m)}footer .row{justify-content:center;margin:10px 0}
.auth{max-width:480px;margin:80px auto}.muted{color:var(--m);font-size:14px}.thumb{height:54px;width:80px;object-fit:cover;border-radius:7px;border:1px solid var(--bd)}hr{border:0;border-top:1px solid var(--bd)}
@media(max-width:820px){.links{flex-wrap:wrap}.hero h1{font-size:clamp(40px,12vw,90px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><canvas id="bg"></canvas><div class="glow"></div><nav id="nav"></nav><main id="app"></main><footer id="foot"><div>Ｒｅｓｐｅｃｔ Admin</div></footer>
<script>
const SUPABASE_URL="https://tehrhgelzbncrmqvxbqk.supabase.co",SUPABASE_KEY="sb_publishable_A0n7XwIzkei3lATUONOh2g_EN2LKFgk";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),bucket="respect-images";
const ADMIN_AUTH_EMAIL="respect-admin@respect-clan.com";
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let state={user:null,settings:{},leaders:[],rules:[],socials:[],apps:[],tab:"dash",open:null,filter:"all",q:"",msg:""};
function msg(text,ok=false){state.msg=`<div class="msg ${ok?"ok":"er"}">${esc(text)}</div>`;render();setTimeout(()=>{state.msg="";render()},3000)}
function loginView(){const clan=state.settings.site_name||"Ｒｅｓｐｅｃｔ";return `<section class="auth"><div class="card"><h2>دخول الأدمن</h2><p class="muted">كل القادة يستخدمون نفس اسم الكلان ونفس الباسورد.</p><label>اسم الكلان</label><input id="clanname" value="${esc(clan)}" autocomplete="username"><label>كلمة المرور</label><input id="pass" type="password" autocomplete="current-password"><button class="btn" style="margin-top:14px;width:100%" onclick="login()">دخول</button>${state.msg}</div></section>`}
function render(){document.documentElement.dataset.theme=localStorage.getItem("theme")||"dark";document.documentElement.style.setProperty("--r",state.settings.color||"#e11d2e");$("#nav").innerHTML=`<div class="logo"><span>${esc(state.settings.site_name||"Ｒｅｓｐｅｃｔ")}</span></div><div class="links"><a href="./index.html">فتح الموقع</a>${state.user?`<button class="ib" onclick="logout()">تسجيل الخروج</button>`:""}</div>`;$("#app").innerHTML=state.user?dashboard():loginView()}
function dashboard(){const tabs=[["dash","Dashboard"],["apps","طلبات الانضمام"],["leaders","أعضاء القيادة"],["rules","شروط الانضمام"],["socials","وسائل التواصل"],["set","إعدادات الموقع"]];let b=state.tab==="dash"?dashTab():state.tab==="apps"?appsTab():state.tab==="set"?settingsTab():listTab(state.tab);return `<section><div class="row" style="justify-content:space-between"><h2>Admin</h2><span class="muted">${esc(state.user.email||"")}</span></div><div class="tabs">${tabs.map(([k,v])=>`<button class="btn ${state.tab===k?"":"s"} sm" onclick="state.tab='${k}';state.open=null;render()">${v}</button>`).join("")}</div>${state.msg}${b}</section>`}
function dashTab(){const c=s=>state.apps.filter(a=>a.status===s).length;return `<div class="grid">${[["TOTAL APPLICATIONS",state.apps.length],["PENDING",c("pending")],["ACCEPTED",c("accepted")],["REJECTED",c("rejected")],["TOTAL LEADERS",state.leaders.length],["TOTAL SOCIAL LINKS",state.socials.length]].map(([a,n])=>`<div class="card"><div style="color:var(--m);font-size:13px">${a}</div><div class="num">${n}</div></div>`).join("")}</div>`}
const CFG={leaders:[["name","الاسم"],["role","الرتبة"],["contact","ID / رقم"],["description","وصف"]],rules:[["rule_text_ar","الشرط (عربي)"],["rule_text_en","Rule (English)"]],socials:[["platform","المنصة"],["url","الرابط"],["icon","أيقونة"],["description","وصف"]]};
function listTab(k){const rows=state[k];return `<div class="card">${rows.map((r,i)=>`<div class="ed">${CFG[k].map(([f,l])=>`<input value="${esc(r[f]??"")}" placeholder="${l}" onchange="updateRow('${k}','${r.id}','${f}',this.value)">`).join("")}${k==="leaders"?`<div>${r.image_url?`<img class="thumb" src="${esc(r.image_url)}">`:""}<input type="file" accept="image/*" onchange="uploadImage('leader','${r.id}',this)"></div>`:""}<div class="row"><button class="btn sm s" onclick="moveRow('${k}',${i},-1)">↑</button><button class="btn sm s" onclick="moveRow('${k}',${i},1)">↓</button><button class="btn sm" onclick="deleteRow('${k}','${r.id}')">🗑</button></div></div>`).join("")}<button class="btn" onclick="addRow('${k}')">+ إضافة</button></div>`}
function settingsTab(){const s=state.settings;return `<div class="card"><label>اسم الكلان</label><input id="set_name" value="${esc(s.site_name||"")}"><label>اللون الرئيسي</label><input id="set_color" value="${esc(s.color||"#e11d2e")}"><label>جملة Hero</label><input id="set_tag" value="${esc(s.hero_tagline||"")}"><label>نبذة</label><textarea id="set_about" rows="4">${esc(s.about||"")}</textarea><label>رقم واتساب استقبال الطلبات</label><input id="set_wa" value="${esc(s.whatsapp||"")}" placeholder="2010XXXXXXXX"><label>صورة الخلفية</label><div class="row">${s.background_url?`<img class="thumb" src="${esc(s.background_url)}"><button class="btn sm s" onclick="clearSetting('background_url')">حذف</button>`:""}<input type="file" accept="image/*" onchange="uploadImage('background',null,this)"></div><label>Logo</label><div class="row">${s.logo_url?`<img class="thumb" src="${esc(s.logo_url)}"><button class="btn sm s" onclick="clearSetting('logo_url')">حذف</button>`:""}<input type="file" accept="image/*" onchange="uploadImage('logo',null,this)"></div><button class="btn" style="margin-top:18px" onclick="saveSettings()">💾 حفظ إعدادات الموقع</button><hr><h3>تغيير باسورد الأدمن</h3><label>الباسورد الجديد</label><input id="newpass" type="password" minlength="6" placeholder="6 أحرف على الأقل"><button class="btn sm" style="margin-top:10px" onclick="changePassword()">تغيير الباسورد</button></div>`}
function appsTab(){let a=state.apps.slice().sort((x,y)=>new Date(y.created_at)-new Date(x.created_at)).filter(x=>(state.filter==="all"||x.status===state.filter)&&(!state.q||(x.name+" "+x.free_fire_id).toLowerCase().includes(state.q.toLowerCase())));const o=state.apps.find(x=>x.id===state.open);return `<div class="row"><input placeholder="Search name / ID" value="${esc(state.q)}" style="max-width:260px" oninput="state.q=this.value;render()">${["all","pending","accepted","rejected"].map(f=>`<button class="btn sm ${state.filter===f?"":"s"}" onclick="state.filter='${f}';render()">${f}</button>`).join("")}</div><div style="overflow-x:auto;margin-top:12px"><table><tr><th>Player</th><th>Free Fire ID</th><th>Age</th><th>Rank</th><th>Date</th><th>Status</th></tr>${a.map(x=>`<tr class="r" onclick="state.open='${x.id}';render()"><td>${esc(x.name)}</td><td>${esc(x.free_fire_id)}</td><td>${esc(x.age)}</td><td>${esc(x.rank)}</td><td>${new Date(x.created_at).toLocaleString()}</td><td><span class="tag ${esc(x.status)}">${esc(x.status)}</span></td></tr>`).join("")}</table></div>${o?`<div class="card" style="margin-top:16px"><h3>Player Details</h3><p>${["name","age","free_fire_id","discord","whatsapp","country","rank","description"].map(k=>`<b>${k}:</b> ${esc(o[k])}`).join("<br>")}</p>${o.video_url?`<p><a href="${esc(o.video_url)}" target="_blank" rel="noopener">🔗 فيديو العضو</a></p>`:""}<label>Note</label><textarea rows="2" onchange="updateRow('applications','${o.id}','note',this.value)">${esc(o.note||"")}</textarea><div class="row" style="margin-top:12px"><button class="btn sm" onclick="updateRow('applications','${o.id}','status','accepted')">Accept</button><button class="btn sm s" onclick="updateRow('applications','${o.id}','status','rejected')">Reject</button><button class="btn sm s" onclick="deleteApplication('${o.id}')">Delete</button></div></div>`:""}`}
async function login(){const clan=$("#clanname").value.trim(),password=$("#pass").value;if(!clan||!password)return msg("اكتب اسم الكلان والباسورد");const expected=(state.settings.site_name||"Ｒｅｓｐｅｃｔ").trim();if(clan!==expected)return msg("اسم الكلان غير صحيح");const {error}=await sb.auth.signInWithPassword({email:ADMIN_AUTH_EMAIL,password});if(error)return msg("اسم الكلان أو الباسورد غير صحيح");await loadAll()}
async function logout(){await sb.auth.signOut();state.user=null;state.settings={};render()}
async function loadAll(){const {data:userData}=await sb.auth.getUser();state.user=userData.user;if(!state.user)return render();try{const [s,l,r,so,a]=await Promise.all([sb.from("site_settings").select("*").eq("id",1).single(),sb.from("leaders").select("*").order("sort_order"),sb.from("rules").select("*").order("sort_order"),sb.from("social_links").select("*").order("sort_order"),sb.from("applications").select("*").order("created_at",{ascending:false})]);for(const q of [s,l,r,so,a])if(q.error)throw q.error;state.settings=s.data||{};state.leaders=l.data||[];state.rules=r.data||[];state.socials=so.data||[];state.apps=a.data||[];render()}catch(e){console.error(e);msg("حصل خطأ في تحميل البيانات: "+e.message)}}
async function saveSettings(){const payload={site_name:$("#set_name").value.trim(),color:$("#set_color").value.trim(),hero_tagline:$("#set_tag").value.trim(),about:$("#set_about").value.trim(),whatsapp:$("#set_wa").value.trim()};const {error}=await sb.from("site_settings").update(payload).eq("id",1);if(error)return msg(error.message);Object.assign(state.settings,payload);msg("تم حفظ إعدادات الموقع بنجاح",true)}
async function changePassword(){const p=$("#newpass").value;if(p.length<6)return msg("الباسورد لازم يكون 6 أحرف على الأقل");const {error}=await sb.auth.updateUser({password:p});if(error)return msg(error.message);$("#newpass").value="";msg("تم تغيير باسورد الأدمن بنجاح",true)}
async function clearSetting(k){const {error}=await sb.from("site_settings").update({[k]:""}).eq("id",1);if(error)return msg(error.message);state.settings[k]="";render()}
async function uploadImage(kind,id,input){const file=input.files[0];if(!file)return;const ext=(file.name.split(".").pop()||"jpg").toLowerCase(),path=`${kind}/${crypto.randomUUID()}.${ext}`;const {error}=await sb.storage.from(bucket).upload(path,file,{upsert:true,contentType:file.type});if(error)return msg("فشل رفع الصورة: "+error.message);const {data}=sb.storage.from(bucket).getPublicUrl(path),url=data.publicUrl;if(kind==="background"||kind==="logo"){const col=kind==="background"?"background_url":"logo_url",r=await sb.from("site_settings").update({[col]:url}).eq("id",1);if(r.error)return msg(r.error.message);state.settings[col]=url}else{const r=await sb.from("leaders").update({image_url:url}).eq("id",id);if(r.error)return msg(r.error.message);const x=state.leaders.find(v=>v.id===id);if(x)x.image_url=url}render();msg("تم رفع الصورة بنجاح",true)}
async function updateRow(table,id,field,value){const real=table==="socials"?"social_links":table,{error}=await sb.from(real).update({[field]:value}).eq("id",id);if(error)return msg(error.message);const arr=table==="applications"?state.apps:state[table],x=arr.find(v=>v.id===id);if(x)x[field]=value;render()}
async function addRow(k){const table=k==="socials"?"social_links":k;let payload={};if(k==="leaders")payload={name:"",role:"",contact:"",description:"",sort_order:state.leaders.length};if(k==="rules")payload={rule_text_ar:"",rule_text_en:"",sort_order:state.rules.length};if(k==="socials")payload={platform:"",url:"",icon:"🔗",description:"",sort_order:state.socials.length};const {error}=await sb.from(table).insert(payload);if(error)return msg(error.message);await loadAll()}
async function deleteRow(k,id){if(!confirm("Delete?"))return;const table=k==="socials"?"social_links":k,{error}=await sb.from(table).delete().eq("id",id);if(error)return msg(error.message);await loadAll()}
async function deleteApplication(id){if(!confirm("Delete?"))return;const {error}=await sb.from("applications").delete().eq("id",id);if(error)return msg(error.message);state.open=null;await loadAll()}
async function moveRow(k,i,d){const arr=state[k],j=i+d;if(j<0||j>=arr.length)return;const table=k==="socials"?"social_links":k,a=arr[i],b=arr[j],ao=a.sort_order??i,bo=b.sort_order??j;await sb.from(table).update({sort_order:bo}).eq("id",a.id);await sb.from(table).update({sort_order:ao}).eq("id",b.id);await loadAll()}
(async()=>{const {data:settingsData}=await sb.from("site_settings").select("site_name,color,hero_tagline,about").eq("id",1).single();if(settingsData)state.settings=settingsData;const {data}=await sb.auth.getSession();state.user=data.session?.user||null;if(state.user)await loadAll();else render()})();
</script>
</body></html>
