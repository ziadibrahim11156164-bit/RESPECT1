 $("#nav").innerHTML=`<div class="logo" onclick="go('home')">${S.set.logo_url?`<img src="${esc(S.set.logo_url)}">`:""}${esc(name())}</div><div class="links">${[["home","home"],["about","about"],["leaders","leaders"],["rules","rules"],["apply","apply"],["contact","contact"]].map(([a,b])=>`<a onclick="go('${a}')">${t(b)}</a>`).join("")}<button class="ib" onclick="S.lang=S.lang==='ar'?'en':'ar';localStorage.setItem('lang',S.lang);render()">${S.lang==="ar"?"EN":"ع"}</button><button class="ib" onclick="S.theme=S.theme==='dark'?'light':'dark';localStorage.setItem('theme',S.theme);render()">◐</button><a class="btn sm" onclick="go('apply')" style="color:#fff">${t("applyNow")}</a></div>`;
